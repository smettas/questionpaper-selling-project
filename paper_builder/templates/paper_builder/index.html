{% load static %}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEET Paper Builder</title>
<link rel="stylesheet" href="{% static 'paper_builder/builder.css' %}">
<script defer src="{% static 'paper_builder/builder.js' %}"></script>
</head>
<body>
<header><div class="brand">NEET Paper Builder</div></header>
<main>
<h1>Create a question paper</h1>
<p class="intro">Choose questions from the bank and download a branded paper with a matching answer key.</p>
<form id="paper-form" action="{% url 'download' %}" method="post" enctype="multipart/form-data">
{% csrf_token %}
<div class="workspace">
<section class="card bank">
<h2>Question selection</h2>
<div id="sections"></div>
<button type="button" id="add-section" class="secondary">+ Add section</button>
</section>
<section class="card details">
<h2>Paper details <span class="muted">(optional)</span></h2>
<label>School or academy<input name="institution" maxlength="120" placeholder="Ojas One Academy"></label>
<label>Paper title<input name="title" maxlength="120"></label>
<label>Exam date<input name="date" type="date"></label>
<div class="grid">
<label>Maximum marks<input name="marks" type="number" min="1" max="10000"></label>
<label>Duration (minutes)<input name="duration" type="number" min="1" max="1440"></label>
</div>
<div class="grid">
<label>Start number<input name="start_number" type="number" min="1" max="9999" value="1" required></label>
<label>End number <span class="muted">(optional)</span><input name="end_number" type="number" min="1" max="9999" placeholder="Automatic"></label>
</div>
<p id="number-range" class="muted" aria-live="polite"></p>
<label>Logo <span class="muted">(optional)</span><input type="file" name="logo" accept="image/png,image/jpeg,image/webp"></label>
<p id="total" aria-live="polite"></p>
<button class="primary" type="submit">Generate &amp; download PDFs</button>
<p id="status" role="status"></p>
</section>
</div>
</form>
</main>
<template id="section-template">
<fieldset>
<legend></legend>
<div class="grid">
<label>Subject<select data-field="subject"><option value="physics">Physics</option><option value="chemistry">Chemistry</option><option value="biology">Biology</option></select></label>
<label>Chapter<select data-field="chapter"></select></label>
<label>Subtopic<select data-field="topic"></select></label>
<label>Difficulty<select data-field="difficulty"><option value="">All difficulties</option><option value="easy">Easy</option><option value="moderate">Moderate</option><option value="hard">Hard</option></select></label>
<label>Questions<input data-field="count" type="number" required min="1" value="10"></label>
</div>
<div class="section-footer"><span class="available" aria-live="polite"></span><button type="button" class="remove">Remove section</button></div>
</fieldset>
</template>
{{ catalog|json_script:"catalog" }}
</body></html>
